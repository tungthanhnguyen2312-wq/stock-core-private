          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/stocks/HPG/trading/orders"
  /market/stocks/{symbol}/trading/orders/history:
    get:
      operationId: stocksGetOrderStatisticHistory
      tags:
        - Bảng giá thị trường
      summary: Lịch sử lệnh mua/bán chủ động
      description: |
        Đây KHÔNG phải lệnh chờ trong sổ lệnh: là **lệnh đã khớp, phân loại theo bên chủ động** — mua chủ động (lifted the offer) và bán chủ động (hit the bid), bao gồm cả thoả thuận.

        Nguồn chỉ có dữ liệu **sau khi đóng phiên**: trong giờ giao dịch, request không kèm `date` trả về phiên đã đóng gần nhất, không phải hôm nay.

        Chuỗi theo phiên. `from`/`to` phải truyền cùng nhau (dạng `YYYY-MM-DD`, khoảng tối đa 5 năm); bỏ trống cả hai → 3 tháng gần nhất. Lịch sử chỉ lưu **từ 2021-01-01** — xin sớm hơn sẽ được cắt về mốc này. Chưa phân trang.
      parameters:
        - name: symbol
          in: path
          required: true
          description: 'Mã cổ phiếu niêm yết (3–10 ký tự chữ/số, không phân biệt hoa thường). VD: VNM, FPT.'
          schema:
            type: string
            example: HPG
        - name: from
          in: query
          required: false
          description: Ngày bắt đầu (bao gồm), dạng `YYYY-MM-DD`. Phải đi kèm `to`. Sớm hơn `2021-01-01` sẽ bị cắt về mốc đó.
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: to
          in: query
          required: false
          description: Ngày kết thúc (bao gồm), dạng `YYYY-MM-DD`. Phải đi kèm `from`, không sớm hơn `from`, và khoảng cách tối đa 5 năm.
          schema:
            type: string
            format: date
            example: '2026-03-31'
      responses:
        '200':
          description: '`data.items` là chuỗi thống kê lệnh chủ động theo phiên.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockOrderStatisticHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/stocks/HPG/trading/orders/history?from=2026-01-01&to=2026-03-31"
components:
  securitySchemes:
    FinhayApiKey:
      type: apiKey
      in: header
      name: X-FH-APIKEY
      description: |
        API key dài hạn của client. Cấu hình 1 lần lúc khởi tạo; có thể wire thẳng
        vào static setter của SDK tự-gen. Đi kèm với `FINHAY_API_SECRET` — secret
        này chỉ dùng ở phía client để tính `X-FH-SIGNATURE`, **không** bao giờ
        gửi qua mạng.
    FinhayTimestamp:
      type: apiKey
      in: header
      name: X-FH-TIMESTAMP
      description: |
        Unix time hiện tại tính bằng **milliseconds**, đưới dạng chuỗi số thập phân.

        Được tính per-request bởi signing middleware. **Không** set thủ công — dùng
        middleware mẫu trong README.
    FinhayNonce:
      type: apiKey
      in: header
      name: X-FH-NONCE
      description: |
        UUIDv4 duy nhất per-request (ví dụ `crypto.randomUUID()`). Server cache
        cặp `(apiKey, nonce)` trong 5 phút; nếu nonce được reuse với cùng apiKey
        trong window này, request sẽ bị từ chối với `AUTH_NONCE_REUSED` (401).

        Server chấp nhận chuỗi opaque bất kỳ về mặt kỹ thuật, nhưng nên dùng
        UUIDv4 để đảm bảo tính unique.

        Được tính per-request bởi signing middleware. **Không** set thủ công —
        xem middleware mẫu trong tài liệu Authentication.
    FinhaySignature:
      type: apiKey
      in: header
      name: X-FH-SIGNATURE
      description: |
        HMAC-SHA256 của canonical signing payload, encode hex (lowercase).

        Signing payload:
        ```
        {X-FH-TIMESTAMP}\n{METHOD}\n{REQUEST_PATH}[?{QUERY}]\n{BODYHASH}
        ```
        - `?{QUERY}` chỉ nối vào path khi request có query string.
        - `{BODYHASH}` là chuỗi rỗng khi body rỗng (vẫn không có newline sau đó).

        Được tính per-request bởi signing middleware. **Không** set thủ công — dùng
        middleware mẫu trong README.
    FinhayBodyHash:
      type: apiKey
      in: header
      name: X-FH-BODYHASH
      description: |
        SHA-256 của raw request body, encode hex (lowercase). **Bắt buộc khi
        request có body** (POST / PUT / PATCH). Có thể bỏ qua — hoặc gửi chuỗi
        rỗng — khi body rỗng.

        Là segment cuối của canonical signing payload
        (`{timestamp}\n{method}\n{path}[?{query}]\n{bodyHash}`). Server dùng giá
        trị client gửi lên để verify chữ ký; server **không** tự hash lại body,
        nên client phải hash đúng chuỗi bytes đã gửi đi.

        Được tính per-request bởi signing middleware. **Không** set thủ công —
        xem middleware mẫu trong tài liệu Authentication.
    FinhayTwoFactor:
      type: apiKey
      in: header
      name: X-FH-2FA-TOKEN
      description: |
        Daily 2FA session JWT do server cấp sau khi user xác thực qua OTP. Áp
        dụng cho các write operation nhạy cảm (đặt / sửa / huỷ lệnh) — phải đi
        cùng đủ 4 header HMAC + `X-FH-BODYHASH`.

        Token có tuổi thọ **1 ngày giao dịch** và được scope theo `apiKey`. Khi
        hết hạn hoặc bị revoke, server trả `HTTP 403` với 1 trong các
        `error_code`:

        - `OTP_SESSION_REQUIRED` — chưa có session, cần khởi tạo OTP flow.
        - `OTP_SESSION_EXPIRED` — session đã hết hạn.
        - `OTP_SESSION_INVALID` — token không hợp lệ / chữ ký sai.
        - `OTP_SESSION_REVOKED` — bị thu hồi (user logout, đổi key, …).

        Khi gặp 403 thuộc các mã trên, client phải chạy lại OTP flow để xin
        token mới rồi retry request.
  schemas:
    EnvelopeBase:
      type: object
      description: |
        Các field chung của envelope trong mọi response của Finhay API.

        - `error_code` là `"0"` (string) khi thành công, mã khác `"0"` khi lỗi.
        - `message` là thông điệp ngắn từ server.
      properties:
        error_code:
          type: string
          description: '`"0"` khi thành công, khác `"0"` khi lỗi.'
          example: '0'
        message:
          type: string
          description: Thông điệp trạng thái dễ đọc.
          example: success
    UserProfile:
      type: object
      description: |
        Profile user trả về từ `GET /users/v1/users/me`.

        Chỉ `user_id` là field luôn có — bootstrap flow chỉ cần field này. Các
        field khác là chuẩn của endpoint user Finhay.
      properties:
        user_id:
          type: integer
          format: int64
          description: User ID của Finhay. Dùng làm path variable `{userId}` ở mọi endpoint user-scoped.
          example: 123456
      required:
        - user_id
    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'
    ErrorBody:
      type: object
      description: Body của response khi 4xx / 5xx.
      properties:
        error_code:
          type: string
          description: Mã lỗi khác `"0"` (ví dụ `AUTH_SIGNATURE_INVALID`, `RATE_LIMIT_EXCEEDED`, …).
          example: '400'
        message:
          type: string
          description: Thông điệp lỗi (tiếng Anh, từ server).
          example: Invalid parameter
      required:
        - error_code
        - message
    SubAccount:
      type: object
      description: |
        1 item tiểu khoản trong response của
        `GET /users/v1/users/{userId}/sub-accounts`.

        Bootstrap flow dùng `id` (làm `subAccountId` cho path) và `type` (chọn
        `Normal` hay `Margin` tuỳ nhu cầu).
      properties:
        id:
          type: string
          description: ID tiểu khoản. Dùng làm giá trị thay cho path variable `{subAccountId}`.
          example: '0001234567'
        cust_id:
          type: string
          description: ID khách hàng cha (chung cho mọi tiểu khoản của 1 user).
          example: '0001234500'
        name:
          type: string
          description: Họ tên đầy đủ của user.
          example: Nguyễn Văn A
        depository_number:
          type: string
          description: Số lưu ký chứng khoán do VSDC cấp.
          example: 120C001234
        product_type_name:
          type: string
          description: |
            Hậu tố loại sản phẩm trong `sub_account_ext`. `.1` cho tiểu khoản
            thường, `.6` cho tiểu khoản margin.
          example: '.1'
        sub_account_ext:
          type: string
          description: Định danh tiểu khoản dạng mở rộng (`{depository_number}{product_type_name}`).
          example: 120C001234.1
        type:
          type: string
          description: Loại tiểu khoản — `Normal` (tiểu khoản thường) hoặc `Margin` (tiểu khoản ký quỹ).
          example: Normal
      required:
        - id
        - sub_account_ext
        - type
    SubAccountsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - result
          properties:
            result:
              type: array
              items:
                $ref: '#/components/schemas/SubAccount'
    BankInterestRate:
      type: object
      description: Lãi suất của một kỳ hạn cụ thể.
      required:
        - percent
        - duration_name
      properties:
        effective_date:
          type: string
          description: Ngày áp dụng, định dạng `D/M/YYYY`.
          example: 31/7/2026
        percent:
          type: string
          description: Lãi suất dạng chuỗi kèm dấu `%`, phần thập phân dùng dấu phẩy (vd `4,4%`).
          example: 4,4%
        duration_name:
          type: string
          description: Tên kỳ hạn.
          example: 12 Tháng
        bank_icon_url:
          type:
            - string
            - 'null'
          format: uri
          description: Logo ngân hàng.
    BankInterestRateGroup:
      type: object
      description: Lãi suất của một ngân hàng theo từng kỳ hạn.
      required:
        - bank_name
        - rates
      properties:
        bank_name:
          type: string
          description: Tên ngân hàng.
          example: ACB
        rates:
          type: array
          items:
            $ref: '#/components/schemas/BankInterestRate'
    BankInterestRates:
      type: object
      description: |
        Lãi suất tiền gửi của các ngân hàng, nhóm theo ngân hàng rồi tới kỳ hạn.
      required:
        - bank_interest_rates
      properties:
        no_bank:
          type: integer
          description: Số ngân hàng có trong danh sách.
          example: 20
        effective_date:
          type: string
          description: Ngày áp dụng chung của bảng, định dạng `D/M/YYYY`.
          example: 31/7/2026
        bank_interest_rates:
          type: array
          description: Mỗi phần tử là một ngân hàng kèm lãi suất theo kỳ hạn.
          items:
            $ref: '#/components/schemas/BankInterestRateGroup'
    BankInterestRatesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/BankInterestRates'
    MacroIndicatorCatalogItem:
      type: object
      required:
        - indicator
        - name
        - tags
        - unit
      properties:
        indicator:
          type: string
          description: Slug định danh của chỉ tiêu — dùng giá trị này để lấy giá trị của chỉ tiêu theo kỳ.
          example: vn-cpi
        name:
          type: string
          example: CPI Việt Nam
        tags:
          type: array
          items:
            type: string
          example:
            - inflation
            - vn
        unit:
          type: string
          example: '%'
    MacroIndicatorCatalogResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MacroIndicatorCatalogItem'
    MacroIndicatorObservation:
      type: object
      required:
        - period
        - value
      properties:
        period:
          type: string
          description: Kỳ dữ liệu (`yyyy`, `yyyy-Qn` hoặc `yyyy-MM`).
          example: 2024-12
        value:
          type:
            - number
            - 'null'
          example: 3.97
    MacroIndicatorSeries:
      type: object
      required:
        - indicator
        - name
        - unit
        - series
      properties:
        indicator:
          type: string
          example: vn-cpi
        name:
          type: string
          example: CPI Việt Nam
        unit:
          type: string
          example: '%'
        series:
          type: array
          items:
            $ref: '#/components/schemas/MacroIndicatorObservation'
    MacroIndicatorSeriesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/MacroIndicatorSeries'
    EconomicCountry:
      type: string
      description: |
        Tên quốc gia hiển thị (full name) cho dữ liệu kinh tế. Dùng trong
        `/market/calendar`.

        | Giá trị | Ý nghĩa |
        |---------|---------|
        | `China` | Trung Quốc |
        | `Euro Area` | Khu vực đồng Euro |
        | `Japan` | Nhật Bản |
        | `United States` | Mỹ |
        | `United Kingdom` | Anh |
        | `Vietnam` | Việt Nam |
      enum:
        - China
        - Euro Area
        - Japan
        - United States
        - United Kingdom
        - Vietnam
      x-enum-varnames:
        - CHINA
        - EURO_AREA
        - JAPAN
        - UNITED_STATES
        - UNITED_KINGDOM
        - VIETNAM
    PageMeta:
      type: object
      description: |
        Metadata phân trang dùng chung cho mọi list API. Dữ liệu của trang nằm ở `results`.
      required:
        - total
        - current_page
        - page_size
      properties:
        total:
          type: integer
          description: Tổng số bản ghi khớp bộ lọc.
          example: 137
        current_page:
          type: integer
          description: Trang hiện tại.
          example: 1
        next_page:
          type: integer
          description: Trang kế tiếp; bằng `current_page` khi đã ở trang cuối.
          example: 2
        previous_page:
          type: integer
          description: Trang trước; bằng 1 khi đang ở trang đầu.
          example: 1
        page_size:
          type: integer
          description: Số bản ghi mỗi trang.
          example: 20
        page_total:
          type: integer
          description: Tổng số trang.
          example: 7
    EconomicEventDetail:
      type: object
      description: Phần đặc thù của sự kiện vĩ mô (`type = ECONOMIC`).
      required:
        - date
        - category
      properties:
        date:
          type: string
          format: date-time
          description: Thời điểm diễn ra sự kiện, ISO 8601 kèm offset (giờ Việt Nam).
          example: '2026-07-29T01:00:00+07:00'
        category:
          type: string
          description: Phân loại sự kiện (ví dụ "Interest Rate", "Inflation", "Employment").
          example: Interest Rate
        actual:
          type:
            - string
            - 'null'
          description: Số liệu thực tế đã công bố. `null` khi sự kiện chưa diễn ra.
          example: 5.50%
        previous:
          type:
            - string
            - 'null'
          description: Số liệu kỳ trước. `null` nếu nguồn không có.
          example: 5.25%
        consensus:
          type:
            - string
            - 'null'
          description: Đồng thuận thị trường (consensus). `null` nếu nguồn không có.
          example: 5.50%
        forecast:
          type:
            - string
            - 'null'
          description: Dự báo nhà phân tích. `null` nếu nguồn không có.
          example: 5.50%
    CalendarEvent:
      type: object
      description: 1 sự kiện trên lịch thị trường. Các trường chung nằm ở cấp ngoài, phần đặc thù theo `type` nằm trong `detail` — thêm loại lịch mới không phá contract cũ.
      required:
        - type
        - country
        - title
        - detail
      properties:
        type:
          type: string
          enum:
            - ECONOMIC
          description: Loại sự kiện. Hiện chỉ có `ECONOMIC` (công bố số liệu vĩ mô).
          example: ECONOMIC
        country:
          allOf:
            - $ref: '#/components/schemas/EconomicCountry'
          description: Quốc gia của sự kiện.
        title:
          type: string
          description: Tên sự kiện (ví dụ "Fed Interest Rate Decision", "CPI MoM").
          example: Fed Interest Rate Decision
        detail:
          allOf:
            - $ref: '#/components/schemas/EconomicEventDetail'
          description: Chi tiết theo `type`; với `ECONOMIC` là số liệu công bố.
    CalendarEventsPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/CalendarEvent'
              description: Sự kiện của trang hiện tại, sort `detail.date` tăng dần.
    CalendarEventsPageResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CalendarEventsPage'
    IndexRecommendationReport:
      type: object
      description: 1 báo cáo khuyến nghị cụ thể.
      properties:
        stock:
          type: string
          description: Mã stock.
          example: VNM
        title:
          type:
            - string
            - 'null'
          description: Tiêu đề báo cáo.
        source:
          type:
            - string
            - 'null'
          description: Nguồn báo cáo (mặc định `VietStock`).
          example: VietStock
        recommendation_price:
          type:
            - number
            - 'null'
          description: Giá khuyến nghị mua vào. Hiện luôn là `null`.
        target_price:
          type:
            - number
            - 'null'
          description: Giá mục tiêu (target price).
          example: 85000
        publish_date:
          type:
            - string
            - 'null'
          format: date-time
          description: Ngày phát hành báo cáo.
        description:
          type:
            - string
            - 'null'
          description: Mô tả ngắn / tóm tắt nội dung báo cáo.
        download_url:
          type:
            - string
            - 'null'
          description: URL tải báo cáo bản đầy đủ (PDF).
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    RecommendationReport:
      type: object
      description: |
        Payload báo cáo khuyến nghị — chứa text khuyến nghị mới nhất và danh
        sách các report cụ thể. Trả về `[]` (array rỗng) khi stock không có
        báo cáo nào — xem `oneOf` trong response của endpoint.
      properties:
        recommendation:
          type:
            - string
            - 'null'
          description: Latest recommendation description (from the most recent report).
        recommendationReports:
          type: array
          items:
            $ref: '#/components/schemas/IndexRecommendationReport'
    RecommendationReportsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              description: |
                Payload báo cáo khuyến nghị, hoặc `null` khi symbol không có báo cáo nào.
              oneOf:
                - $ref: '#/components/schemas/RecommendationReport'
                - type: 'null'
    MarketNewsTopic:
      type: string
      description: Chủ đề tin tức thị trường.
      enum:
        - crypto
        - forex
        - stock
        - commodities
        - macro
      example: stock
    MarketNewsItem:
      type: object
      required:
        - id
        - title
        - url
        - published_at
        - topic
      properties:
        id:
          type: string
          example: abc123
