        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/stocks/VNM/ownership"
  /market/stocks/{symbol}/ownership/foreign-room:
    get:
      operationId: stocksGetForeignRoom
      tags:
        - Bảng giá thị trường
      summary: Room ngoại (phiên gần nhất)
      description: |
        Room ngoại của 1 mã tại phiên gần nhất: trần sở hữu nước ngoài (`max_pct`, `max_volume`), khối lượng khối ngoại đang nắm (`owned`) và room còn lại (`available`). Chuỗi theo ngày xem ở `/market/stocks/{symbol}/ownership/foreign-room/history`.
      parameters:
        - name: symbol
          in: path
          required: true
          description: 'Mã cổ phiếu niêm yết (3–10 ký tự chữ/số, không phân biệt hoa thường). VD: VNM, FPT.'
          schema:
            type: string
            example: VNM
      responses:
        '200':
          description: '`data` là room ngoại tại phiên gần nhất.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignRoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
