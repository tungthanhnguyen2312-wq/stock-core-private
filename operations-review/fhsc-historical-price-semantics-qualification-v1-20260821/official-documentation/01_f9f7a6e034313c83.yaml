openapi: 3.1.0
info:
  title: Finhay Securities Open API
  version: 0.2.0-preview.3
  description: |
    Đặc tả chính thức của Finhay Securities Open API, dùng chung cho SDK
    codegen, Redoc docs, và (sau này) mock server / contract test.

    ## Authentication — 2 tier

    - **Tier 1 — chỉ cần API key**: các endpoint đọc dữ liệu thị trường
      (`GET /market/**`, `GET /trading/market/**`). Gửi kèm header
      `X-FH-APIKEY` là đủ.
    - **Tier 2 — HMAC signing**: các endpoint liên quan đến account /
      trading / user. Gửi kèm 4 header `X-FH-APIKEY` + `X-FH-TIMESTAMP` +
      `X-FH-NONCE` + `X-FH-SIGNATURE`; thêm `X-FH-BODYHASH` khi request có
      body. Chi tiết thuật toán xem extension `x-finhay-signing` ở root
      spec hoặc phần README.

    ## Bootstrap flow

    Gọi 2 endpoint tag **Khởi tạo** (`GET /users/v1/users/me` và
    `GET /users/v1/users/{userId}/sub-accounts`) **1 lần khi khởi tạo
    client** để lấy thông tin `user_id` và `subAccountId`. Mọi endpoint thuộc
    tag **Tổng tài sản / Tiểu khoản / Danh mục đầu tư / Sổ lệnh / Lãi-lỗ /
    Quyền cổ đông** đều cần 2 giá trị này để truyền vào path parameter.
  contact: {}
servers:
  - url: https://open-api.fhsc.com.vn
    description: Production
security:
  - FinhayApiKey: []
tags:
  - name: Khởi tạo
    description: Khởi tạo client — lấy `user_id` và `subAccountId`. Gọi 1 lần khi khởi tạo SDK rồi cache lại.
  - name: Bảng giá thị trường
    description: Giá realtime, lịch sử và sổ lệnh thống nhất cho stocks / indices / forex / crypto / hàng hoá / quỹ mở / trái phiếu / ETF.
  - name: Phân tích cơ bản
    description: Chỉ số tài chính cơ bản của doanh nghiệp — chỉ số tổng quan, phân tích theo kỳ và báo cáo tài chính chuẩn (income statement / balance sheet / cash flow).
  - name: Tin tức-sự kiện
    description: Sự kiện doanh nghiệp (cổ tức, quyền mua, ĐHCĐ, …), tin tức stock, tin tức tài chính toàn cầu (forex / commodities / economic-indicators / stock-market / cryptocurrency) và báo cáo khuyến nghị từ analyst.
  - name: Kinh tế vĩ mô
    description: Chỉ số kinh tế vĩ mô (CPI, PMI, PCE, GDP, …), lãi suất tiền gửi ngân hàng và lịch sự kiện kinh tế.
  - name: Tổng tài sản
    description: Tổng quan tài sản cấp user — cross-product (stock, fund, bond, hay0) kèm cash, debt, PnL.
  - name: Tiểu khoản
    description: Thông tin tiểu khoản — số dư, margin, dư nợ và ngân hàng liên kết.
  - name: Danh mục đầu tư
    description: Danh mục stock đang nắm giữ kèm giá realtime và PnL theo vị thế.
  - name: Sổ lệnh
    description: Quản lý lệnh — sổ lệnh trong ngày, danh sách đầy đủ hoặc chi tiết theo `orderId`.
  - name: Lãi-lỗ
    description: PnL và analytics cá nhân — lãi / lỗ trong ngày tổng hợp theo user.
  - name: Quyền cổ đông
    description: Quyền cổ đông (cổ tức, quyền mua, bỏ phiếu, …) của tiểu khoản.
  - name: Phiên giao dịch
    description: Hạ tầng trading — trạng thái phiên giao dịch và order type khả dụng của mỗi exchange.
  - name: Thực thi lệnh
    description: |
      ⚠️ Nhóm endpoint này đang ở giai đoạn **preview**.

      Đặt / sửa / huỷ lệnh trên sàn — write operation nhạy cảm, yêu cầu
      Tier 2 HMAC đầy đủ + `X-FH-BODYHASH` + `X-FH-2FA-TOKEN` (daily 2FA
      session).
paths:
  /users/v1/users/me:
    get:
      operationId: bootstrapGetMe
      tags:
        - Khởi tạo
      security:
        - FinhayApiKey: []
          FinhayTimestamp: []
          FinhayNonce: []
          FinhaySignature: []
      summary: Lấy thông tin user hiện tại
      description: |
        Trả về thông tin user hiện tại — đặc biệt là `data.user_id`, giá trị bắt
        buộc cần truyền vào path variable `{userId}` ở mọi endpoint user-scoped
        (assets summary, pnl-today, …).

        Đây là **bước 1 của bootstrap flow** — gọi đúng 1 lần khi khởi tạo client,
        cache `user_id` lại để dùng cho toàn bộ vòng đời client. Re-fetch khi
        nhận `401` từ endpoint user-scoped (account có thể bị disable / rotate).

        Là endpoint Tier 2 → cần đủ 4 header HMAC (`X-FH-APIKEY`,
        `X-FH-TIMESTAMP`, `X-FH-NONCE`, `X-FH-SIGNATURE`).
      responses:
        '200':
          description: Trả về `data.user_id` — số nguyên 64-bit dùng làm path variable cho mọi endpoint user-scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                error_code: '0'
                message: success
                data:
                  user_id: 123456
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              -H "X-FH-TIMESTAMP: $TIMESTAMP_MS" \
              -H "X-FH-NONCE: $NONCE_UUID" \
              -H "X-FH-SIGNATURE: $SIGNATURE_HEX" \
              "https://open-api.fhsc.com.vn/users/v1/users/me"
  /users/v1/users/{userId}/sub-accounts:
    get:
      operationId: bootstrapGetSubAccounts
      tags:
        - Khởi tạo
      security:
        - FinhayApiKey: []
          FinhayTimestamp: []
          FinhayNonce: []
          FinhaySignature: []
      summary: Danh sách tiểu khoản của user
      description: |
        Trả về danh sách tiểu khoản của user. Mỗi entry có `id` (dùng làm path
        variable `{subAccountId}`), `type` (`Normal` hoặc `Margin`),
        `sub_account_ext`, cùng các field hồ sơ user (`cust_id`, `name`,
        `depository_number`, `product_type_name`).

        Đây là **bước 2 của bootstrap flow**, gọi sau `bootstrapGetMe`. Cache
        danh sách tiểu khoản tương tự `user_id`. Khi user thao tác trading thì
        chọn entry có `type` đúng nhu cầu — `Normal` cho tài khoản thường,
        `Margin` cho tài khoản ký quỹ.

        Là endpoint Tier 2 → cần đủ 4 header HMAC.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Trả về mảng `result[]` các tiểu khoản đã mở của user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountsResponse'
              example:
                error_code: '0'
                message: success
                result:
                  - id: '0001234567'
                    cust_id: '0001234500'
                    name: Nguyễn Văn A
                    depository_number: 120C001234
                    product_type_name: '.1'
                    sub_account_ext: 120C001234.1
                    type: Normal
                  - id: '0001234568'
                    cust_id: '0001234500'
                    name: Nguyễn Văn A
                    depository_number: 120C001234
                    product_type_name: '.6'
                    sub_account_ext: 120C001234.6
                    type: Margin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              -H "X-FH-TIMESTAMP: $TIMESTAMP_MS" \
              -H "X-FH-NONCE: $NONCE_UUID" \
              -H "X-FH-SIGNATURE: $SIGNATURE_HEX" \
              "https://open-api.fhsc.com.vn/users/v1/users/$USER_ID/sub-accounts"
  /market/financial-data/bank-interest-rates:
    get:
      operationId: macroGetBankInterestRates
      tags:
        - Kinh tế vĩ mô
      summary: Lãi suất tiền gửi ngân hàng
      description: |
        Lãi suất tiền gửi tiết kiệm của các ngân hàng tại Việt Nam, phân theo
        kỳ hạn (`1 Tháng`, `3 Tháng`, `6 Tháng`, `12 Tháng`, …).

        `data.bank_interest_rates` là danh sách ngân hàng; mỗi phần tử có
        `bank_name` và mảng `rates` — lãi suất từng kỳ hạn, dạng chuỗi kèm dấu
        `%` (phần thập phân dùng dấu phẩy, vd `4,4%`).
      responses:
        '200':
          description: Trả về `data.bank_interest_rates` — danh sách ngân hàng, mỗi ngân hàng kèm lãi suất theo từng kỳ hạn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankInterestRatesResponse'
              example:
                error_code: '0'
                message: success
                data:
                  no_bank: 20
                  effective_date: 31/7/2026
                  bank_interest_rates:
                    - bank_name: ACB
                      rates:
                        - effective_date: 31/7/2026
                          percent: 3,1%
                          duration_name: 6 Tháng
                          bank_icon_url: https://cdn.finhay.com.vn/banks/acb.png
                        - effective_date: 31/7/2026
                          percent: 4,4%
                          duration_name: 12 Tháng
                          bank_icon_url: https://cdn.finhay.com.vn/banks/acb.png
                    - bank_name: Vietcombank
                      rates:
                        - effective_date: 31/7/2026
                          percent: 2,9%
                          duration_name: 6 Tháng
                          bank_icon_url: https://cdn.finhay.com.vn/banks/vcb.png
                        - effective_date: 31/7/2026
                          percent: 4,6%
                          duration_name: 12 Tháng
                          bank_icon_url: https://cdn.finhay.com.vn/banks/vcb.png
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/financial-data/bank-interest-rates"
  /market/macro/indicators:
    get:
      operationId: listMacroIndicators
      tags:
        - Kinh tế vĩ mô
      summary: Danh mục chỉ tiêu vĩ mô
      description: |
        Danh mục các chỉ tiêu vĩ mô khả dụng (GDP, CPI, lãi suất…) kèm `indicator` (slug), tên, `tags` phân loại và `unit`. Gọi tool này trước để tra `slug` hợp lệ dùng cho `/market/macro/indicators/{indicator}`. Lọc tùy chọn bằng `tags` (CSV) hoặc `search`.
      parameters:
        - name: tags
          in: query
          required: false
          description: Lọc theo tag, phân tách bằng dấu phẩy (vd `inflation,vn`).
          schema:
            type: string
            example: inflation
        - name: search
          in: query
          required: false
          description: Từ khóa tìm theo tên/slug chỉ tiêu.
          schema:
            type: string
            example: CPI
      responses:
        '200':
          description: '`data` là mảng chỉ tiêu vĩ mô kèm slug và unit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroIndicatorCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/macro/indicators"
  /market/macro/indicators/{indicator}:
    get:
      operationId: getMacroIndicator
      tags:
        - Kinh tế vĩ mô
      summary: Giá trị chỉ tiêu vĩ mô
      description: |
        Giá trị của một chỉ tiêu vĩ mô cho một quốc gia (xác định bởi `indicator` slug lấy từ `/market/macro/indicators`). Bỏ trống `from`/`to` → chỉ trả về kỳ mới nhất; truyền khoảng thời gian → chuỗi theo kỳ (sort mới nhất ở đầu). `period` có dạng `yyyy`, `yyyy-Qn` hoặc `yyyy-MM`. `value` có thể `null` khi nguồn chưa có dữ liệu.
      parameters:
        - name: indicator
          in: path
          required: true
          description: 'Slug chỉ tiêu vĩ mô. Chỉ dùng slug có sẵn trong danh mục chỉ tiêu vĩ mô đã tra trước đó — không tự đoán, slug sai sẽ không khớp chỉ tiêu nào. VD: `vn-cpi`.'
          schema:
            type: string
            example: vn-cpi
        - name: from
          in: query
          required: false
          description: Kỳ bắt đầu (bao gồm). Dạng `yyyy`, `yyyy-Qn` hoặc `yyyy-MM`.
          schema:
            type: string
            example: 2024-01
        - name: to
          in: query
          required: false
          description: Kỳ kết thúc (bao gồm). Dạng `yyyy`, `yyyy-Qn` hoặc `yyyy-MM`.
          schema:
            type: string
            example: 2024-12
        - name: limit
          in: query
          required: false
          description: Số kỳ tối đa trả về (1–500). Mặc định 100 khi có khoảng thời gian; 1 khi bỏ trống `from`/`to`.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            example: 100
      responses:
        '200':
          description: '`data.series` là mảng `{period, value}` theo kỳ.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroIndicatorSeriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/macro/indicators/vn-cpi?from=2024-01&to=2024-12"
  /market/calendar:
    get:
      operationId: calendarListEvents
      tags:
        - Kinh tế vĩ mô
      summary: Lịch sự kiện thị trường
      description: |
        Lịch các sự kiện thị trường theo ngày, **không gắn với mã cổ phiếu**. Hiện trả về sự kiện công bố số liệu vĩ mô (FOMC / quyết định lãi suất, CPI, GDP, PMI, …) của 6 nền kinh tế — Trung Quốc, Khu vực đồng Euro, Nhật Bản, Mỹ, Anh, Việt Nam.

        Mỗi sự kiện có `type` phân loại (hiện chỉ `ECONOMIC`) và phần đặc thù nằm trong `detail`. Với sự kiện vĩ mô, `detail` gồm số liệu `actual` (thực tế), `previous` (kỳ trước), `consensus` (đồng thuận thị trường) và `forecast` (dự báo) — các trường này là `null` khi sự kiện chưa diễn ra hoặc nguồn chưa có số.

        Khoảng thời gian lọc qua `from`/`to` (Unix timestamp tính bằng GIÂY). Bỏ trống cả hai thì mặc định lấy sự kiện từ hôm nay trở đi. Sort theo `detail.date` tăng dần, phân trang qua `page`/`page_size`.
      parameters:
        - name: country
          in: query
          required: false
          description: Lọc theo quốc gia. Bỏ qua để lấy mọi quốc gia hỗ trợ.
          schema:
            $ref: '#/components/schemas/EconomicCountry'
        - name: from
          in: query
          required: false
          description: Mốc đầu khoảng lọc — Unix timestamp tính bằng GIÂY.
          schema:
            type: integer
            minimum: 0
            example: 1767225600
        - name: to
          in: query
          required: false
          description: Mốc cuối khoảng lọc — Unix timestamp tính bằng GIÂY, phải >= `from`.
          schema:
            type: integer
            minimum: 0
            example: 1769904000
        - name: page
          in: query
          required: false
          description: Trang (bắt đầu từ 1). Mặc định 1.
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: page_size
          in: query
          required: false
          description: Số sự kiện mỗi trang (1–50). Mặc định 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            example: 20
      responses:
        '200':
          description: '`data` là trang sự kiện kèm `results` và thông tin phân trang.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventsPageResponse'
              example:
                error_code: '0'
                message: success
                data:
                  results:
                    - type: ECONOMIC
                      country: United States
                      title: Fed Interest Rate Decision
                      detail:
                        date: '2026-07-29T01:00:00+07:00'
                        category: Interest Rate
                        actual: null
                        previous: 5.25%
                        consensus: 5.50%
                        forecast: 5.50%
                    - type: ECONOMIC
                      country: Vietnam
                      title: CPI MoM
                      detail:
                        date: '2026-07-29T00:00:00+07:00'
                        category: Inflation
                        actual: null
                        previous: 0.2%
                        consensus: 0.3%
                        forecast: 0.3%
                  total: 137
                  current_page: 1
                  next_page: 2
                  previous_page: 1
                  page_size: 20
                  page_total: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/calendar?country=United%20States&page=1&page_size=20"
  /market/recommendation-reports/{symbol}:
    get:
      operationId: corporateGetRecommendationReports
      tags:
        - Tin tức-sự kiện
      summary: Báo cáo khuyến nghị theo stock
      description: |
        Báo cáo khuyến nghị (research report) của các công ty chứng khoán cho 1
        mã stock. Khi stock có báo cáo, `data` là object chứa `recommendation`
        (khuyến nghị mới nhất, plain text) và `recommendationReports[]` (danh
        sách báo cáo gốc kèm download URL). Khi stock không có báo cáo nào,
        `data` là `[]`.

        Source: VietStock và một số nhà phân tích khác — xem field `source` của
        mỗi report.
      parameters:
        - name: symbol
          in: path
          required: true
          description: Mã stock viết hoa (3–4 ký tự, ví dụ `VNM`, `FPT`, `HPG`). Yêu cầu khớp chính xác với mã niêm yết.
          schema:
            type: string
            example: VNM
      responses:
        '200':
          description: 'Trả về `data` chứa `recommendation` (latest) và `recommendationReports[]` (full list); `data: []` khi stock không có báo cáo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationReportsResponse'
              example:
                error_code: '0'
                message: success
                data:
                  recommendation: Mua — upside 15% tới giá mục tiêu 85.000đ.
                  recommendationReports:
                    - stock: VNM
                      title: VNM — Update Q1 2024
                      source: VietStock
                      recommendation_price: null
                      target_price: 85000
                      publish_date: '2024-04-10T09:00:00Z'
                      description: Mua — upside 15% tới giá mục tiêu 85.000đ.
                      download_url: https://vietstock.vn/reports/vnm-q1-2024.pdf
                      created_at: '2024-04-10T09:00:00Z'
                      updated_at: '2024-04-10T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/recommendation-reports/VNM"
  /market/market-news:
    get:
      operationId: corporateGetMarketNews
      tags:
        - Tin tức-sự kiện
      summary: Danh sách tin tức thị trường
      description: |
        Dòng tin tức tài chính, gồm cả quốc tế và thị trường Việt Nam, kèm phân trang. Lọc tùy chọn theo `topic` (forex / hàng hoá / chứng khoán / crypto / vĩ mô); phân trang qua `page`/`page_size`. Khi `topic=stock`, có thể kết hợp tham số `symbol` để lọc theo mã chứng khoán. Mỗi item là bản tóm tắt (không có toàn văn); dùng `id` gọi `/market/market-news/{id}` để lấy nội dung đầy đủ.
      parameters:
        - name: topic
          in: query
          required: false
          description: Lọc theo chủ đề tin tức. Khi `topic=stock`, có thể kết hợp tham số `symbol` để lọc theo mã chứng khoán.
          schema:
            $ref: '#/components/schemas/MarketNewsTopic'
        - name: symbol
          in: query
          required: false
          description: Mã chứng khoán cần lọc. Chỉ áp dụng khi `topic=stock`.
          schema:
            type: string
            example: FPT
        - name: page
          in: query
          required: false
          description: Trang (bắt đầu từ 1). Mặc định 1.
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: page_size
          in: query
          required: false
          description: Số item mỗi trang (1–50). Mặc định 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            example: 20
      responses:
        '200':
          description: '`data` là trang tin tức kèm `items` và thông tin phân trang.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketNewsPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
              "https://open-api.fhsc.com.vn/market/market-news?topic=stock&page=1&page_size=20"
