        owned:
          type:
            - number
            - 'null'
          description: Khối lượng khối ngoại đang nắm.
          example: 1969955445
        available:
          type:
            - number
            - 'null'
          description: Room ngoại còn lại (số cổ phiếu).
          example: 120000000
        updated_at:
          type: string
          format: date-time
          description: Thời điểm dữ liệu (ISO 8601 kèm offset).
          example: '2026-05-27T14:30:15+07:00'
    ForeignRoomResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ForeignRoom'
    ForeignRoomBar:
      type: object
      description: Room ngoại của một phiên trong chuỗi lịch sử. Mỗi bar mang theo trần sở hữu tại phiên đó vì `max_volume` đổi khi doanh nghiệp phát hành thêm.
      required:
        - date
      properties:
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        max_pct:
          type:
            - number
            - 'null'
          description: Trần sở hữu nước ngoài (%).
          example: 100
        max_volume:
          type:
            - number
            - 'null'
          description: Trần sở hữu nước ngoài (số cổ phiếu).
          example: 2089955445
        owned:
          type:
            - number
            - 'null'
          description: Khối lượng khối ngoại đang nắm.
          example: 1969955445
        available:
          type:
            - number
            - 'null'
          description: Room ngoại còn lại (số cổ phiếu).
          example: 120000000
    ForeignRoomHistory:
      type: object
      description: Chuỗi room ngoại theo phiên, đã phân trang.
      required:
        - symbol
        - items
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: VNM
        resolution:
          type: string
          description: Độ phân giải của bar.
          example: 1D
        from:
          type: string
          format: date
          description: Ngày bắt đầu khoảng đã áp dụng.
          example: '2026-02-27'
        to:
          type: string
          format: date
          description: Ngày kết thúc khoảng đã áp dụng.
          example: '2026-05-27'
        page:
          type: integer
          description: Trang hiện tại.
          example: 1
        page_size:
          type: integer
          description: Số phiên mỗi trang.
          example: 20
        total:
          type: integer
          description: Tổng số phiên trong khoảng.
          example: 61
        items:
          type: array
          description: Chuỗi bar theo phiên.
          items:
            $ref: '#/components/schemas/ForeignRoomBar'
        updated_at:
          type: string
          format: date-time
          description: Thời điểm dữ liệu (ISO 8601 kèm offset).
          example: '2026-05-27T14:30:15+07:00'
    ForeignRoomHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ForeignRoomHistory'
    StockTechnicalPrice:
      type: object
      description: Giá đóng cửa của một phiên trong cửa sổ, để đối chiếu với chỉ báo.
      required:
        - date
        - close
      properties:
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-07-31'
        close:
          type: number
          description: Giá đóng cửa (nghìn đồng).
          example: 21.7
    StockTechnicalPoint:
      type: object
      description: |-
        Một phiên trong chuỗi của một chỉ báo: `date` cộng các thành phần mà chính chỉ báo đó sinh ra.

        Tên thành phần theo từng chỉ báo — chỉ báo một đường (SMA, EMA, RSI, ATR, CCI, WILLIAMS_R, OBV, MFI, VOLUME_SMA) trả `value`; `MACD` trả `macd_line`/`signal_line`/`histogram`; `BBANDS` trả `upper`/`middle`/`lower`; `STOCH` trả `k`/`d`; `ADX` trả `value`/`plus_di`/`minus_di`; `SUPERTREND` và `PSAR` trả `value` kèm `direction` (`UP`/`DOWN`); `ICHIMOKU` trả `tenkan`/`kijun`/`senkou_a`/`senkou_b`/`chikou`.
      required:
        - date
      properties:
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-07-31'
      additionalProperties:
        type:
          - number
          - string
        description: Giá trị một thành phần của chỉ báo; `direction` là chuỗi, còn lại là số.
      example:
        date: '2026-07-31'
        macd_line: -0.179
        signal_line: 0.014
        histogram: -0.193
    StockTechnicalSeries:
      type: object
      description: Chuỗi của một chỉ báo đã yêu cầu.
      required:
        - indicator
        - params
        - display_name
        - data
      properties:
        indicator:
          type: string
          description: Tên chỉ báo.
          example: MACD
        params:
          type: string
          description: Tham số đã áp dụng, ngăn bởi dấu phẩy (rỗng với `OBV`).
          example: 12,26,9
        display_name:
          type: string
          description: Ký pháp đầy đủ để hiển thị.
          example: MACD(12,26,9)
        data:
          type: array
          description: Chuỗi theo phiên; đúng 1 phần tử ở chế độ phiên gần nhất. Rỗng khi không tính được — khi đó xem `note`, các chỉ báo khác vẫn trả bình thường.
          items:
            $ref: '#/components/schemas/StockTechnicalPoint'
        note:
          type: string
          description: Lý do `data` rỗng (vd `SUPERTREND`/`PSAR` cần tối thiểu 200 phiên). Chỉ xuất hiện khi có.
          example: Cần tối thiểu 200 phiên, mã hiện có 143
    StockTechnicals:
      type: object
      description: Chỉ báo kỹ thuật của một mã trên cửa sổ đã tính.
      required:
        - symbol
        - resolution
        - from
        - to
        - prices
        - indicators
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        resolution:
          type: string
          description: Khung thời gian của bar; luôn là `1D`.
          example: 1D
        from:
          type: string
          format: date
          description: Phiên đầu tiên thực sự được tính — đã lùi khỏi ngày nghỉ, không phải ngày client gửi lên.
          example: '2026-05-04'
        to:
          type: string
          format: date
          description: Phiên cuối cùng được tính. Bằng `from` ở chế độ phiên gần nhất.
          example: '2026-07-31'
        prices:
          type: array
          description: Giá đóng cửa của cửa sổ, liệt kê một lần ở cấp trên thay vì lặp trong từng chỉ báo. Align với chuỗi chỉ báo theo `date`.
          items:
            $ref: '#/components/schemas/StockTechnicalPrice'
        indicators:
          type: array
          description: Mỗi chỉ báo đã yêu cầu một phần tử, theo đúng thứ tự yêu cầu.
          items:
            $ref: '#/components/schemas/StockTechnicalSeries'
    StockTechnicalsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/StockTechnicals'
    TradedAmount:
      type: object
      description: Cặp khối lượng / giá trị của một dòng giao dịch.
      required:
        - volume
        - value
      properties:
        volume:
          type: number
          description: Khối lượng (số cổ phiếu).
          example: 12543200
        value:
          type: number
          description: Giá trị giao dịch (VND).
          example: 341175200000
    StockTrading:
      type: object
      description: Giao dịch tổng của một mã trong một phiên (khớp lệnh + thoả thuận).
      required:
        - symbol
        - date
        - total
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        total:
          $ref: '#/components/schemas/TradedAmount'
        matched:
          allOf:
            - $ref: '#/components/schemas/TradedAmount'
          description: Phần khớp lệnh. `null` khi nguồn không tách được phương thức.
        put_through:
          allOf:
            - $ref: '#/components/schemas/TradedAmount'
          description: Phần thoả thuận. `null` khi nguồn không tách được phương thức.
        updated_at:
          type: string
          format: date-time
          description: Thời điểm phiên được ghi lần cuối (ISO 8601 kèm offset).
          example: '2026-05-27T14:45:02+07:00'
    StockTradingResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/StockTrading'
    StockTradingBar:
      type: object
      description: Một phiên trong chuỗi giao dịch tổng.
      required:
        - date
        - total
      properties:
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        total:
          $ref: '#/components/schemas/TradedAmount'
        matched:
          allOf:
            - $ref: '#/components/schemas/TradedAmount'
          description: Phần khớp lệnh. `null` khi nguồn không tách được phương thức.
        put_through:
          allOf:
            - $ref: '#/components/schemas/TradedAmount'
          description: Phần thoả thuận. `null` khi nguồn không tách được phương thức.
    StockTradingHistory:
      type: object
      description: Chuỗi giao dịch tổng theo phiên. Phiên không có giao dịch bị bỏ qua; chưa phân trang.
      required:
        - symbol
        - data
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        resolution:
          type: string
          description: Độ phân giải của bar.
          example: 1D
        data:
          type: array
          description: Chuỗi bar theo phiên, phiên gần nhất đứng trước.
          items:
            $ref: '#/components/schemas/StockTradingBar'
    StockTradingHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/StockTradingHistory'
    TradingMethodBreakdown:
      type: object
      description: 'Một chiều giao dịch tách theo phương thức: `matched` (khớp lệnh) + `put_through` (thoả thuận) = `total`.'
      required:
        - total
      properties:
        total:
          $ref: '#/components/schemas/TradedAmount'
        matched:
          allOf:
            - $ref: '#/components/schemas/TradedAmount'
          description: Phần khớp lệnh. `null` khi nguồn không tách được phương thức.
        put_through:
          allOf:
            - $ref: '#/components/schemas/TradedAmount'
          description: Phần thoả thuận. `null` khi nguồn không tách được phương thức.
    TradingFlow:
      type: object
      description: Dòng tiền mua / bán / ròng của một nhóm nhà đầu tư trong một phiên.
      required:
        - symbol
        - date
        - buy
        - sell
        - net
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        buy:
          allOf:
            - $ref: '#/components/schemas/TradingMethodBreakdown'
          description: Chiều mua.
        sell:
          allOf:
            - $ref: '#/components/schemas/TradingMethodBreakdown'
          description: Chiều bán.
        net:
          allOf:
            - $ref: '#/components/schemas/TradingMethodBreakdown'
          description: Ròng = mua − bán. Âm nghĩa là bán ròng.
        updated_at:
          type: string
          format: date-time
          description: Thời điểm trả dữ liệu (ISO 8601 kèm offset).
          example: '2026-05-27T14:45:02+07:00'
    TradingFlowResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TradingFlow'
    TradingFlowBar:
      type: object
      description: Một phiên trong chuỗi dòng tiền.
      required:
        - date
        - buy
        - sell
        - net
      properties:
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        buy:
          allOf:
            - $ref: '#/components/schemas/TradingMethodBreakdown'
          description: Chiều mua.
        sell:
          allOf:
            - $ref: '#/components/schemas/TradingMethodBreakdown'
          description: Chiều bán.
        net:
          allOf:
            - $ref: '#/components/schemas/TradingMethodBreakdown'
          description: Ròng = mua − bán. Âm nghĩa là bán ròng.
    TradingFlowHistory:
      type: object
      description: Chuỗi dòng tiền theo phiên. Phiên không có giao dịch bị bỏ qua; chưa phân trang.
      required:
        - symbol
        - data
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        resolution:
          type: string
          description: Độ phân giải của bar.
          example: 1D
        data:
          type: array
          description: Chuỗi bar theo phiên, phiên gần nhất đứng trước.
          items:
            $ref: '#/components/schemas/TradingFlowBar'
    TradingFlowHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TradingFlowHistory'
    OrderSideStatistic:
      type: object
      description: Thống kê một chiều lệnh khớp chủ động trong phiên.
      required:
        - order_count
        - volume
      properties:
        order_count:
          type: number
          description: Số lệnh khớp về phía này.
          example: 18422
        volume:
          type: number
          description: Tổng khối lượng khớp về phía này (số cổ phiếu).
          example: 9871300
        avg_volume_per_order:
          type:
            - number
            - 'null'
          description: Khối lượng trung bình mỗi lệnh. `null` khi `order_count = 0` (không có trung bình để tính).
          example: 535.8
    StockOrderStatistic:
      type: object
      description: Thống kê lệnh mua / bán chủ động của một mã trong một phiên.
      required:
        - symbol
        - date
        - buy
        - sell
        - net_volume
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        buy:
          allOf:
            - $ref: '#/components/schemas/OrderSideStatistic'
          description: Mua chủ động (lifted the offer).
        sell:
          allOf:
            - $ref: '#/components/schemas/OrderSideStatistic'
          description: Bán chủ động (hit the bid).
        net_volume:
          type: number
          description: '`buy.volume − sell.volume`. Âm khi bên bán chủ động hơn — đây là số liệu bình thường, không phải lỗi.'
          example: -412700
        updated_at:
          type: string
          format: date-time
          description: Thời điểm phiên được ghi lần cuối (ISO 8601 kèm offset).
          example: '2026-05-27T18:05:11+07:00'
    StockOrderStatisticResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/StockOrderStatistic'
    StockOrderStatisticBar:
      type: object
      description: Một phiên trong chuỗi thống kê lệnh chủ động.
      required:
        - date
        - buy
        - sell
        - net_volume
      properties:
        date:
          type: string
          format: date
          description: Ngày của phiên (`YYYY-MM-DD`).
          example: '2026-05-27'
        buy:
          allOf:
            - $ref: '#/components/schemas/OrderSideStatistic'
          description: Mua chủ động.
        sell:
          allOf:
            - $ref: '#/components/schemas/OrderSideStatistic'
          description: Bán chủ động.
        net_volume:
          type: number
          description: '`buy.volume − sell.volume`; có thể âm.'
          example: -412700
    StockOrderStatisticHistory:
      type: object
      description: Chuỗi thống kê lệnh chủ động theo phiên. Chưa phân trang.
      required:
        - symbol
        - items
      properties:
        symbol:
          type: string
          description: Mã cổ phiếu.
          example: HPG
        items:
          type: array
          description: Chuỗi bar theo phiên.
          items:
            $ref: '#/components/schemas/StockOrderStatisticBar'
    StockOrderStatisticHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/StockOrderStatisticHistory'
  responses:
    BadRequest:
      description: Request không hợp lệ — thiếu hoặc sai tham số.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error_code: '400'
            message: Invalid parameter
    Unauthorized:
      description: Không xác thực — thiếu, sai hoặc không hợp lệ chữ ký / API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error_code: '401'
            message: Invalid signature
    RateLimited:
      description: Vượt giới hạn rate limit. Chờ đến thời điểm `X-RateLimit-Reset` rồi thử lại.
      headers:
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error_code: '429'
            message: Too many requests
    InternalError:
      description: Lỗi server nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error_code: '500'
            message: Internal server error
    NotFound:
      description: Tài nguyên không tồn tại — `error_code` mô tả cụ thể loại tài nguyên không tìm thấy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error_code: '404'
            message: Not found
    Forbidden:
      description: |
        Không đủ quyền — IP bị chặn, scope bị từ chối, hoặc 2FA session
        (`X-FH-2FA-TOKEN`) chưa có / hết hạn / không hợp lệ / bị revoke. Khi
        `error_code` là 1 trong `OTP_SESSION_REQUIRED|EXPIRED|INVALID|REVOKED`,
        client cần chạy lại OTP flow để lấy token mới rồi retry request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error_code: OTP_SESSION_EXPIRED
            message: 2FA session has expired
  headers:
    XRateLimitReset:
      description: |
        Unix timestamp (giây) — thời điểm window rate limit reset. Client nhận
        `429 Too Many Requests` nên chờ đến thời điểm này rồi retry.
      schema:
        type: integer
        format: int64
        example: 1713441600
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: |
        User ID. Được lấy từ bootstrap flow (`GET /users/v1/users/me`).
      schema:
        type: integer
        format: int64
        example: 123456
    SubAccountId:
      name: subAccountId
      in: path
      required: true
      description: |
        subAccountId được lấy từ bootstrap flow
        (`GET /users/v1/users/{userId}/sub-accounts`), chọn NORMAL hoặc MARGIN
        tuỳ mục đích.
      schema:
        type: string
        example: '0001234567'
    DeviceId:
      name: device-id
      in: header
      required: true
      description: |
        Định danh thiết bị đặt lệnh — chuỗi định danh (device identifier) của thiết
        bị mà người dùng dùng để đặt / sửa / huỷ lệnh. Do client cung cấp theo mỗi
        request, phục vụ tuân thủ quy định giao dịch chứng khoán (lưu vết thiết bị
        giao dịch). Không lấy từ token / phiên xác thực.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: a1b2c3d4-5e6f-7890-abcd-ef1234567890
    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        ID lệnh trên sàn — lấy từ field `order_id` trong response của
        `POST /trading/oa/sub-accounts/{subAccountId}/orders` (Place Order)
        hoặc từ `GET /trading/v1/accounts/{subAccountId}/order-book` (sổ lệnh
        trong ngày). Bắt buộc khi sửa hoặc huỷ lệnh.
      schema:
        type: string
        example: ORD123456
x-finhay-signing:
  algorithm: HMAC-SHA256
  encoding: hex-lowercase
  payloadLayout: |-
    {timestamp}
    {method}
    {path}[?{query}]
    {bodyHash}
  timestampToleranceSec: 30
  nonce:
    format: UUIDv4
    ttlSec: 300
    replayError: AUTH_NONCE_REUSED
  bodyHash:
    algorithm: SHA-256
    encoding: hex-lowercase
    header: X-FH-BODYHASH
    required: whenBodyPresent
  appliesTo:
    apiKeyOnly:
      - GET /market/**
      - GET /trading/market/**
      - GET /trading/securities/**
    fullHmac:
      description: All other routes — including every `/users/**` and `/trading/**` path not listed above — require the full HMAC signing block.
    twoFactor:
      description: |
        Write operation đặt / sửa / huỷ lệnh dưới `/trading/oa/**` thêm
        header `X-FH-2FA-TOKEN` (apiKey scheme `FinhayTwoFactor`) cùng
        với 5 header HMAC. Token là daily session JWT do server cấp sau
        khi user xác thực qua OTP.
      routes:
        - POST /trading/oa/sub-accounts/{subAccountId}/orders
        - PUT /trading/oa/sub-accounts/{subAccountId}/orders/{orderId}
        - DELETE /trading/oa/sub-accounts/{subAccountId}/orders/{orderId}
  headers:
    apiKey: X-FH-APIKEY
    timestamp: X-FH-TIMESTAMP
    nonce: X-FH-NONCE
    signature: X-FH-SIGNATURE
    bodyHash: X-FH-BODYHASH
