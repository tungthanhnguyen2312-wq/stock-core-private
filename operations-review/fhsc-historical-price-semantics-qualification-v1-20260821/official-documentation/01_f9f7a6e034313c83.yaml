        > sàn chấp nhận. Nếu `code` non-null thì sàn từ chối lệnh (`order_status`
        > thường là `REJECTED` hoặc `FAILED`), `rejected_reason` chứa lý do dịch
        > sang ngôn ngữ end-user. Xem bảng `Order-level error codes` trong trang
        > Errors.
      required:
        - order_id
        - account_id
        - transaction_date
        - symbol
        - order_side
        - order_quantity
        - order_status
        - order_type
        - lot
      properties:
        order_id:
          type: string
          description: ID lệnh do sàn cấp.
          example: ORD123456
        account_id:
          type: string
          description: Sub-account ID dạng extended.
          example: 120C000008.1
        transaction_date:
          type: string
          description: Ngày giao dịch, định dạng `YYYY-MM-DD`.
          example: '2026-05-28'
        symbol:
          type: string
          example: HPG
        order_side:
          $ref: '#/components/schemas/OrderSide'
        order_quantity:
          type: integer
          format: int64
          description: Tổng số lượng đã đặt.
          example: 100
        limit_price:
          type:
            - integer
            - 'null'
          format: int64
          description: Giá limit (VND), `null` nếu là MARKET order.
          example: 25500
        market_price:
          description: Loại giá thị trường, `null` nếu là LIMIT order.
          oneOf:
            - $ref: '#/components/schemas/MarketPriceCode'
            - type: 'null'
        execute_quantity:
          type: integer
          format: int64
          description: Số lượng đã khớp tới hiện tại.
          example: 0
        execute_price:
          type: integer
          format: int64
          description: Giá khớp trung bình (VND), `0` nếu chưa khớp.
          example: 0
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        fee_amount:
          type: number
          description: Phí giao dịch (VND).
          example: 0
        tax_amount:
          type: number
          description: Thuế (VND).
          example: 0
        execute_amount:
          type: integer
          format: int64
          description: Giá trị đã khớp = `execute_quantity * execute_price` (VND).
          example: 0
        order_type:
          $ref: '#/components/schemas/OrderType'
        code:
          type:
            - string
            - 'null'
          description: |
            Mã lỗi cấp lệnh do sàn / ORS trả về. `null` khi lệnh hợp lệ. Khi
            non-null, đi kèm `rejected_reason` mô tả lý do — xem trang Errors.
          example: null
        rejected_reason:
          type:
            - string
            - 'null'
          description: Lý do lệnh bị từ chối (đã dịch tiếng Việt), `null` khi `code = null`.
          example: null
        lot:
          $ref: '#/components/schemas/LotType'
    PlaceOrderResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - result
          properties:
            result:
              type: array
              description: |
                Mảng kết quả — thông thường chứa **đúng 1** entry phản ánh lệnh
                vừa đặt. Server vẫn trả về dưới dạng array để đồng nhất với
                modify / cancel.
              items:
                $ref: '#/components/schemas/OrderExecutionResult'
    ModifyOrderRequest:
      type: object
      description: |
        Body của request sửa lệnh
        (`PUT /trading/oa/sub-accounts/{subAccountId}/orders/{orderId}`). Cả 2
        field đều optional nhưng phải có **ít nhất 1**.

        Chỉ sửa được trên phần lệnh **chưa khớp** và khi trạng thái lệnh thuộc
        `SENT` hoặc `WAITING_TO_SEND`. Với lệnh đã khớp một phần, server sẽ
        return `code = -701111` và sửa chỉ áp dụng cho phần unmatched.
      minProperties: 1
      properties:
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: Số lượng mới (bội số lot size).
          example: 200
        price:
          type: integer
          format: int64
          minimum: 1
          description: Giá limit mới, đơn vị **VND** (không nhân 1000).
          example: 26000
      example:
        quantity: 200
        price: 26000
    ModifyOrderResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - result
          properties:
            result:
              type: array
              description: |
                Mảng kết quả — thông thường chứa **đúng 1** entry phản ánh trạng
                thái lệnh sau khi sửa. Khi lệnh đã khớp một phần, server có thể
                trả `code = -701111` nghĩa là chỉ sửa được phần unmatched.
              items:
                $ref: '#/components/schemas/OrderExecutionResult'
    CancelOrderRequest:
      type: object
      description: |
        Body của request huỷ lệnh
        (`DELETE /trading/oa/sub-accounts/{subAccountId}/orders/{orderId}`).

        > ⚠️ Đây là DELETE request có body — không chuẩn HTTP nhưng là contract
        > thật của upstream. Client phải tính `X-FH-BODYHASH` từ body này.

        Chỉ huỷ được khi trạng thái lệnh thuộc `SENT`, `WAITING_TO_SEND`,
        `SENDING`. Với lệnh đã khớp một phần, huỷ chỉ áp dụng cho phần
        unmatched.
      required:
        - sub_account
      properties:
        sub_account:
          type: string
          description: |
            Sub-account ID dạng extended (kèm hậu tố `.1` / `.6` …) — cùng giá
            trị dùng cho `sub_account` trong place-order.
          example: 120C000008.1
      example:
        sub_account: 120C000008.1
    CancelOrderResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - result
          properties:
            result:
              type: array
              description: |
                Mảng kết quả — thông thường chứa **đúng 1** entry phản ánh trạng
                thái lệnh sau khi huỷ. `order_status` thường là `CANCELLED`
                (huỷ toàn bộ) hoặc giữ nguyên kèm phần `execute_quantity` cũ
                nếu lệnh đã khớp một phần (chỉ huỷ phần unmatched).
              items:
                $ref: '#/components/schemas/OrderExecutionResult'
