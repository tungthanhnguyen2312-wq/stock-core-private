    FinancialPeriod:
      type: string
      description: |
        Kỳ báo cáo cho truy vấn tài chính doanh nghiệp.

        | Giá trị | Ý nghĩa |
        |---------|---------|
        | `annual` | Theo năm |
        | `quarterly` | Theo quý |
      enum:
        - annual
        - quarterly
      x-enum-varnames:
        - ANNUAL
        - QUARTERLY
    FinancialAnalysisEntry:
      type: object
      description: |
        Các chỉ số tài chính cho 1 kỳ báo cáo. `year` luôn có; `quarter` chỉ có
        khi `period=quarterly`. Các field còn lại là metric code động (ví dụ
        `pe`, `roe`, `eps`, `pb`) nhận giá trị số hoặc null — bộ key thay đổi
        theo loại doanh nghiệp (ngân hàng có `nim`, sản xuất có `gross_margin`,
        …).
      properties:
        year:
          type: integer
          example: 2023
        quarter:
          type:
            - integer
            - 'null'
          description: Present only for quarterly period (1–4).
          example: 2
      additionalProperties:
        type:
          - number
          - 'null'
    FinancialAnalysisResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FinancialAnalysisEntry'
    FinancialStatementType:
      type: string
      description: |
        Loại báo cáo dùng cho `/market/v2/financial-statement/statement`.

        | Giá trị | Ý nghĩa |
        |---------|---------|
        | `income-statement` | Báo cáo kết quả kinh doanh |
        | `balance-sheet` | Bảng cân đối kế toán |
        | `cash-flow` | Báo cáo lưu chuyển tiền tệ |
      enum:
        - income-statement
        - balance-sheet
        - cash-flow
      x-enum-varnames:
        - INCOME_STATEMENT
        - BALANCE_SHEET
        - CASH_FLOW
    FinancialStatementEntry:
      type: object
      description: |
        1 row báo cáo tài chính cho 1 kỳ, trả về từ
        `/market/v2/financial-statement/statement`. `year` luôn có; `quarter`
        chỉ có khi `period=quarterly` (giá trị `1`–`4`).

        Các key còn lại là **metric code động** (tên romanized tiếng Việt, ví
        dụ `luuchuyentienthuantuhoatdongkinhdoanh`, `tienvatuongduongtiendaunam`,
        `loinhuanlotruocthue`, …) nhận giá trị số hoặc `null`. Bộ key phụ thuộc
        vào tham số `type` — income-statement, balance-sheet và cash-flow có bộ
        field khác nhau, mỗi loại mấy chục field. Tham chiếu
        `additionalProperties` trong schema là nguồn chuẩn.
      properties:
        year:
          type: integer
          description: Fiscal year.
          example: 2025
        quarter:
          type:
            - integer
            - 'null'
          description: Quarter (`1`–`4`) for quarterly rows; null for annual.
          example: 4
      additionalProperties:
        type:
          - number
          - 'null'
      required:
        - year
    FinancialStatementResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FinancialStatementEntry'
