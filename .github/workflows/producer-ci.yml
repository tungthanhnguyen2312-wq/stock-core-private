name: Producer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Hermetic core tier (docs/CI_AND_DEPENDENCY_TIERS.md):
# - installs ONLY requirements.txt + requirements-test.txt under constraints.txt; the optional
#   remaining provider file (requirements-providers.txt: anthropic) is never installed;
#   Vnstock/VNAI live acquisition is retired;
# - tests/provider_import_block/sitecustomize.py (via PYTHONPATH) refuses vnstock/vnai in every
#   interpreter of the job, subprocesses included, so a hidden provider import fails loudly;
# - no secrets, no provider calls, no retained evidence (operations-review/ and data/ are
#   gitignored and absent from a clean clone).
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}/tests/provider_import_block
  CORE_INSTALL: python -m pip install -r requirements.txt -r requirements-test.txt -c constraints.txt
