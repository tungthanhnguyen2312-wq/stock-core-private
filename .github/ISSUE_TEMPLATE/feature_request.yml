name: Đề xuất tính năng
description: Đề xuất cải tiến có phạm vi rõ ràng cho Stock Lookup
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề hoặc tình huống sử dụng
      description: Đề xuất này giải quyết vấn đề nào của người dùng, người duy trì hoặc hoạt động nghiên cứu?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Thay đổi đề xuất
      description: Mô tả thay đổi nhỏ nhất có ích và hành vi mong đợi.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / ngữ nghĩa nguồn
      description: Nếu đề xuất phụ thuộc vào ngữ nghĩa dữ liệu thị trường, hành vi point-in-time hoặc nguồn bên ngoài, hãy mô tả evidence hiện có và những điều chưa biết.
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi và nội dung không thực hiện
      description: Những nội dung nào cần được xác định rõ là ngoài phạm vi?
