name: Câu hỏi bảo mật (không nhạy cảm)
description: Hỏi về mô hình bảo mật công khai mà không tiết lộ lỗ hổng
title: "[Security]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Không tiết lộ lỗ hổng, thông tin xác thực, thông tin bí mật hoặc chi tiết tái hiện nhạy cảm tại đây. Với báo cáo lỗ hổng, hãy thực hiện riêng theo SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: Câu hỏi
      description: Chỉ đặt câu hỏi không nhạy cảm về mô hình bảo mật hoặc cách đóng góp đã được ghi nhận.
    validations:
      required: true
